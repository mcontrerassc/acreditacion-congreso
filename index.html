
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Acreditación Congreso</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      padding: 20px;
      margin: auto;
      background: #f5f6fa;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 8px;
    }
    button {
      background: #233f76;
      color: white;
      border: none;
      font-weight: bold;
    }
    #resultado {
      padding: 22px;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      white-space: pre-line;
    }
    .ok { background: #dcfce7; color: #166534; }
    .alerta { background: #fef3c7; color: #92400e; }
    .error { background: #fee2e2; color: #991b1b; }
    .oculto { display: none; }
  </style>
</head>

<body>
  <h2>Acreditación Congreso</h2>

  <div class="panel">
    <label>PIN del personal</label>
    <input type="password" id="pin" autocomplete="off">

    <label>Entrada</label>
    <select id="puerta">
      <option>Entrada A</option>
      <option>Entrada B</option>
      <option>Entrada C</option>
    </select>

    <button id="iniciar" onclick="iniciar()">
      Iniciar escáner
    </button>
  </div>

  <div class="panel">
    <div id="reader"></div>
  </div>

  <div id="resultado" class="oculto"></div>

  <button id="siguiente" class="oculto"
          onclick="siguiente()">
    Escanear siguiente persona
  </button>

<script>
  // Pega aquí la URL /exec de tu Apps Script.
  const API = 'https://script.google.com/macros/s/AKfycbytJ0lGjiGrln8lekZKoiTaZDeG78ZPOz0g7E3vOqCS9fN_gD50LRiI_UyPahQsCNOthw/exec';

  let scanner;
  let ocupado = false;
  let espera = null;

  function iniciar() {
    if (!document.getElementById('pin').value.trim()) {
      alert('Introduce el PIN');
      return;
    }

    document.getElementById('iniciar').disabled = true;

    scanner = new Html5QrcodeScanner(
      'reader',
      {
        fps: 10,
        qrbox: { width: 240, height: 240 }
      },
      false
    );

    scanner.render(escanear, () => {});
  }

  function escanear(codigo) {
    if (ocupado) return;
    ocupado = true;

    try { scanner.pause(true); } catch (e) {}

    mostrar('Verificando...', 'alerta');

    const params = new URLSearchParams({
      accion: 'registrar',
      codigo: codigo,
      puerta: document.getElementById('puerta').value,
      pin: document.getElementById('pin').value
    });

    const script = document.createElement('script');
    script.src = API + '?' + params.toString();

    espera = setTimeout(() => {
      mostrar('No se recibió respuesta. Revisa la conexión ' +
        'y el registro antes de reintentar.', 'error');
      document.getElementById('siguiente')
        .classList.remove('oculto');
      script.remove();
      espera = null;
    }, 20000);

    script.onerror = () => {
      if (espera) clearTimeout(espera);
      espera = null;
      mostrar('No se pudo conectar con Apps Script', 'error');
      document.getElementById('siguiente')
        .classList.remove('oculto');
      script.remove();
    };

    document.body.appendChild(script);
  }

  // Apps Script ejecuta esta función al responder.
  
window.recibirResultado = function(res) {
  if (espera) clearTimeout(espera);
  espera = null;

  let mensaje = '';

  if (res.nombre) {
    mensaje += res.nombre + '\n\n';
  }

  mensaje += res.mensaje;

  if (res.estado === 'valido' ||
      res.estado === 'repetido') {

    if (res.ultimoIngreso) {
      mensaje += '\n\nÚltimo ingreso anterior: ' +
        res.ultimoIngreso;

      if (res.puertaAnterior) {
        mensaje += '\nPuerta anterior: ' +
          res.puertaAnterior;
      }
    } else {
      mensaje += '\n\nPrimer ingreso';
    }

    mensaje += '\nIngresos totales: ' +
      res.totalIngresos;
  }

  const estilo = res.estado === 'valido'
    ? 'ok'
    : res.estado === 'repetido'
    ? 'alerta'
    : 'error';

  mostrar(mensaje, estilo);

  document.getElementById('siguiente')
    .classList.remove('oculto');
};


  function mostrar(mensaje, estilo) {
    const el = document.getElementById('resultado');
    el.className = estilo;
    el.textContent = mensaje;
  }

  function siguiente() {
    ocupado = false;
    document.getElementById('resultado')
      .className = 'oculto';
    document.getElementById('siguiente')
      .classList.add('oculto');

    try { scanner.resume(); }
    catch (e) { mostrar('Reinicia el escáner', 'error'); }
  }
</script>
</body>
</html>
